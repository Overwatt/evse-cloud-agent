; evse-cloud-agent — the portable core of the EVSE cloud relay protocol's
; device agent. There is no firmware target here: the core is platform free
; and this project exists to compile and test it on the host.
;
;   pio test -e native
;
; Firmware consumes the two files in src/ directly (vendored or as a
; PlatformIO library), supplying its own EvseCloudAgentHost.

[env:native]
platform = native
framework =
test_framework = doctest
test_build_src = true
build_flags = -std=gnu++17 -I src
lib_deps = bblanchon/ArduinoJson@6.20.1
